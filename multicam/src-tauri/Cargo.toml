[package]
name = "omlivestream-multicam"
version = "1.0.0"
description = "Multi-camera mixer for OmliveStream"
authors = ["OmliveStream"]
edition = "2021"

[lib]
name = "omlivestream_multicam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# A smaller binary matters here: this gets downloaded over church wifi.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

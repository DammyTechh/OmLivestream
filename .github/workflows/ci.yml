# Lives in .github/workflows/ because that is the only path GitHub reads.
#
# This file previously sat at backend/ci-cd.yml, where it was never executed —
# so every push went out with no type check, no lint and no build gate. It is
# unchanged apart from this move and the notes below.
name: OmliveStream CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Type-check & lint backend ──────────────────────────────────
  backend-check:
    name: Backend — Type Check & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      # `npm run lint` is eslint --fix, which mutates files. In CI there is
      # nothing to commit the fixes to, and auto-fixing can mask a real
      # failure, so check without writing.
      - name: Lint
        run: npx eslint src --ext .ts --max-warnings=0

  # ── Type-check frontend ────────────────────────────────────────
  frontend-check:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build (catches all Next.js errors)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.vercel.app/api/v1
          NEXT_PUBLIC_SOCKET_URL: https://placeholder.vercel.app

  # ── Backend deployment ───────────────────────────────────────
  #
  # There is deliberately no backend deploy job here, and it is not an
  # oversight — the previous one pushed the backend to Vercel, which cannot
  # run it:
  #
  #   • mediasoup runs long-lived C++ worker processes and holds a UDP port
  #     range (40000-49999). Serverless functions are short-lived and cannot
  #     bind UDP at all, so WebRTC ingest could never work.
  #   • Socket.io needs persistent WebSocket connections for live comments and
  #     viewer counts.
  #   • ffmpeg is spawned as a child process per broadcast and must outlive any
  #     single request.
  #   • BullMQ workers run continuously.
  #
  # The backend belongs on a VPS or container host. Deploy it from there —
  # this workflow's job is to stop broken code reaching it, which the checks
  # above do.

  # ── Deploy frontend to Vercel (main branch only) ─────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    needs: [frontend-check]
    runs-on: ubuntu-latest
    # Skips silently when the Vercel secrets are not configured, instead of
    # failing the run with a red X. A deploy that cannot be attempted is not a
    # broken build, and a permanently-red workflow is one people stop reading —
    # which defeats the point of having checks at all.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEPLOY_FRONTEND == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          working-directory: frontend
          vercel-args: '--prod'

# ── Enabling the frontend deploy ─────────────────────────────────
#
# The deploy job is off until you switch it on, so the workflow stays green
# while only the checks matter.
#
# 1. Settings → Secrets and variables → Actions → Variables
#      DEPLOY_FRONTEND = true
#
# 2. Settings → Secrets and variables → Actions → Secrets
#      VERCEL_TOKEN               → Vercel → Account Settings → Tokens
#      VERCEL_ORG_ID              → Vercel → Account Settings → General
#      VERCEL_FRONTEND_PROJECT_ID → Vercel → Frontend project → Settings → General
#
# If Vercel is already deploying on git push via its own GitHub integration,
# leave DEPLOY_FRONTEND unset — otherwise both will deploy the same commit and
# race each other.
